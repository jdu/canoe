[project]
name = "canoe-worker"
version = "0.1.0"
description = "Generic worker image: consumes a Kafka topic, runs a user-supplied step function, produces to the next topic. Step code is resolved at startup from CANOE_CODE_SOURCE, so the same image serves every Python step in a pipeline."
requires-python = ">=3.11"
dependencies = [
    "confluent-kafka>=2.4",
    "boto3>=1.34",
    "pyarrow>=15.0",
    "cryptography>=42.0",
]

[tool.setuptools.packages.find]
include = ["canoe_worker*"]
